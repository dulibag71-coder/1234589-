<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTIGRAVITY GOLF - SIMULATION MODE</title>
    <script src="https://cdn.jsdelivr.net/gh/kripken/ammo.js@master/builds/ammo.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #00f2ff;
            --secondary: #006aff;
            --accent: #f1c40f;
            --danger: #e74c3c;
            --glass: rgba(0, 0, 0, 0.75);
            --neon-shadow: 0 0 15px rgba(0, 242, 255, 0.5);
        }

        body {
            margin: 0;
            overflow: hidden;
            background: #000;
            font-family: 'Outfit', sans-serif;
            color: #fff;
        }

        #app {
            width: 100vw;
            height: 100vh;
            position: relative;
        }

        #canvas-container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: 0;
        }

        /* GDR Pro HUD System */
        #ui-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: 10;
        }

        .hud-panel {
            background: var(--glass);
            backdrop-filter: blur(20px);
            border: 1px solid rgba(255, 255, 255, 0.1);
            border-radius: 16px;
            padding: 20px;
            pointer-events: auto;
            box-shadow: 0 8px 32px rgba(0, 0, 0, 0.4);
        }

        #top-bar {
            position: absolute;
            top: 25px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 25px;
            width: 96%;
            justify-content: space-between;
            align-items: flex-start;
        }

        .hole-card {
            display: flex;
            flex-direction: column;
            gap: 4px;
        }

        .hole-num {
            font-size: 2.2em;
            font-weight: 900;
            color: var(--primary);
            filter: drop-shadow(var(--neon-shadow));
            line-height: 1;
        }

        .hole-meta {
            font-size: 0.9em;
            opacity: 0.7;
            font-weight: 400;
        }

        .status-panel {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .status-badge {
            padding: 8px 35px;
            border-radius: 40px;
            font-weight: 900;
            font-size: 1.25em;
            letter-spacing: 2px;
            transition: all 0.3s ease;
            text-transform: uppercase;
            box-shadow: var(--neon-shadow);
        }

        .status-ready {
            background: var(--primary);
            color: #000;
        }

        .status-wait {
            background: rgba(255, 255, 255, 0.1);
            color: #fff;
            opacity: 0.5;
        }

        #minimap-container {
            position: absolute;
            top: 130px;
            left: 30px;
            width: 240px;
            height: 420px;
            background: rgba(0, 0, 0, 0.5);
            border: 1px solid rgba(0, 242, 255, 0.3);
            border-radius: 20px;
            overflow: hidden;
            box-shadow: var(--neon-shadow);
        }

        #minimap {
            width: 100%;
            height: 100%;
            background: #0a0a0a;
            position: relative;
        }

        .map-ball {
            position: absolute;
            width: 12px;
            height: 12px;
            background: #fff;
            border-radius: 50%;
            box-shadow: 0 0 15px #fff;
            z-index: 10;
        }

        .map-pin {
            position: absolute;
            width: 14px;
            height: 14px;
            background: var(--danger);
            border-radius: 50%;
            z-index: 5;
            border: 2px solid #fff;
            box-shadow: 0 0 10px var(--danger);
        }

        #bottom-metrics {
            position: absolute;
            bottom: 35px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            width: 96%;
            height: 160px;
        }

        .metric-card {
            flex: 1;
            background: var(--glass);
            border-radius: 24px;
            border: 1px solid rgba(255, 255, 255, 0.15);
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            transition: transform 0.2s ease;
        }

        .metric-card:hover {
            transform: translateY(-5px);
            border-color: var(--primary);
        }

        .metric-card.highlight {
            background: linear-gradient(145deg, var(--secondary) 0%, #001a33 100%);
            border: 1px solid var(--primary);
            box-shadow: var(--neon-shadow);
        }

        .metric-value {
            font-size: 3.4em;
            font-weight: 900;
            line-height: 1;
            margin-bottom: 5px;
        }

        .metric-label {
            font-size: 0.85em;
            color: var(--primary);
            font-weight: 900;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .metric-unit {
            font-size: 0.75em;
            opacity: 0.5;
            margin-top: 2px;
        }

        #video-container {
            position: absolute;
            bottom: 220px;
            right: 40px;
            width: 300px;
            height: 168px;
            border-radius: 20px;
            overflow: hidden;
            transform: scaleX(-1);
            border: 2px solid var(--primary);
            box-shadow: var(--neon-shadow);
        }

        video {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        #ai-report {
            position: absolute;
            top: 130px;
            right: 40px;
            width: 340px;
            border-left: 4px solid var(--accent);
        }

        .btn-exit {
            background: rgba(255, 255, 255, 0.1);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #fff;
            padding: 12px;
            border-radius: 50%;
            cursor: pointer;
            pointer-events: auto;
            text-decoration: none;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
        }

        .btn-exit:hover {
            background: var(--danger);
        }
    </style>
</head>

<body>
    <div id="app">
        <div id="canvas-container"></div>
        <div id="ui-overlay">
            <div id="top-bar">
                <div class="hud-panel hole-card">
                    <span class="hole-num" id="ui-hole-num">HOLE 1</span>
                    <span class="hole-meta" id="ui-hole-par">PAR 4 | 380m</span>
                </div>
                <div class="hud-panel status-panel">
                    <span id="swing-status" class="status-badge status-ready">READY</span>
                    <small id="vision-debug" style="font-size: 11px; opacity: 0.4; letter-spacing: 1px;">VISION:
                        INITIALIZING</small>
                </div>
                <div class="hud-panel" style="display:flex; align-items:center; gap:15px;">
                    <div style="text-align:right;">
                        <div style="font-weight:900; color:var(--primary);">PLAYER 1</div>
                        <div style="font-size:0.8em; opacity:0.6;">LEVEL 42</div>
                    </div>
                    <a href="index.html" class="btn-exit">✕</a>
                </div>
            </div>

            <div id="minimap-container">
                <div id="minimap">
                    <div id="map-pin" class="map-pin"></div>
                    <div id="map-ball" class="map-ball"></div>
                </div>
                <div style="position:absolute; bottom:20px; width:100%; text-align:center;">
                    <div style="font-size:11px; opacity:0.5; margin-bottom:2px;">REMAINING</div>
                    <div style="font-size:18px; font-weight:900;"><span id="dist-to-pin">380</span>m</div>
                </div>
            </div>

            <div id="ai-report" class="hud-panel" style="display: none;">
                <div
                    style="color: var(--accent); font-weight: 900; font-size: 1.1em; margin-bottom: 10px; display:flex; align-items:center; gap:8px;">
                    <span>●</span> AI SWING ANALYSIS
                </div>
                <div id="report-content"
                    style="font-size: 0.9em; line-height:1.6; opacity:0.85; white-space: pre-wrap;"></div>
            </div>

            <div id="bottom-metrics">
                <div class="metric-card">
                    <span class="metric-label">Ball Speed</span>
                    <span id="val-ballspeed" class="metric-value">0.0</span>
                    <span class="metric-unit">m/s</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">Launch Angle</span>
                    <span id="val-launchangle" class="metric-value">0.0</span>
                    <span class="metric-unit">deg</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">Spin Rate</span>
                    <span id="val-backspin" class="metric-value">0</span>
                    <span class="metric-unit">rpm</span>
                </div>
                <div class="metric-card">
                    <span class="metric-label">Carry</span>
                    <span id="val-carry" class="metric-value">0.0</span>
                    <span class="metric-unit">m</span>
                </div>
                <div class="metric-card highlight">
                    <span class="metric-label" style="color:#fff;">Total Distance</span>
                    <span id="val-totaldist" class="metric-value">0.0</span>
                    <span class="metric-unit" style="opacity:0.8;">m</span>
                </div>
            </div>
        </div>
        <div id="video-container">
            <video id="input-video" autoplay playsinline muted></video>
        </div>
    </div>
    <script type="module" src="/src/main.js"></script>
</body>

</html>
