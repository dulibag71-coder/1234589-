<!DOCTYPE html>
<html lang="ko">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ANTIGRAVITY GOLF - PREVIOUS PORTAL</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@100;400;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --primary: #2ecc71;
            --secondary: #27ae60;
            --bg: #0a0a0a;
            --text: #ffffff;
        }

        body,
        html {
            margin: 0;
            padding: 0;
            width: 100%;
            height: 100%;
            font-family: 'Outfit', sans-serif;
            background: var(--bg);
            color: var(--text);
            overflow: hidden;
        }

        .hero-video {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: cover;
            filter: brightness(0.4) saturate(1.2);
            z-index: -1;
        }

        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: radial-gradient(circle at center, transparent 0%, rgba(0, 0, 0, 0.8) 100%);
            z-index: 0;
        }

        .container {
            position: relative;
            z-index: 10;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
        }

        h1 {
            font-size: 8vw;
            font-weight: 900;
            letter-spacing: -0.05em;
            margin: 0;
            text-transform: uppercase;
            background: linear-gradient(to bottom, #fff 40%, #888 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            animation: slideUp 1.2s cubic-bezier(0.23, 1, 0.32, 1);
        }

        p {
            font-size: 1.5vw;
            font-weight: 100;
            opacity: 0.7;
            margin-top: -10px;
            letter-spacing: 0.5em;
            animation: fadeIn 2s ease 0.5s forwards;
            opacity: 0;
        }

        .menu {
            margin-top: 60px;
            display: flex;
            gap: 40px;
            animation: fadeIn 2s ease 1s forwards;
            opacity: 0;
        }

        .menu-item {
            text-decoration: none;
            color: #fff;
            font-size: 1.2rem;
            font-weight: 400;
            text-transform: uppercase;
            letter-spacing: 0.2em;
            padding: 15px 40px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            border-radius: 50px;
            background: rgba(255, 255, 255, 0.05);
            backdrop-filter: blur(10px);
            transition: all 0.4s cubic-bezier(0.4, 0, 0.2, 1);
        }

        .menu-item:hover {
            background: var(--primary);
            border-color: var(--primary);
            box-shadow: 0 0 30px rgba(46, 204, 113, 0.4);
            transform: translateY(-5px) scale(1.05);
        }

        .menu-item.active {
            background: #fff;
            color: #000;
            border: none;
        }

        @keyframes slideUp {
            from {
                transform: translateY(50px);
                opacity: 0;
            }

            to {
                transform: translateY(0);
                opacity: 1;
            }
        }

        @keyframes fadeIn {
            to {
                opacity: 1;
            }
        }

        .footer-info {
            position: absolute;
            bottom: 40px;
            width: 100%;
            display: flex;
            justify-content: space-around;
            opacity: 0.5;
            font-size: 0.8rem;
            letter-spacing: 0.1em;
        }
    </style>
</head>

<body>
    <div class="overlay"></div>
    <!-- 배경을 위한 추후 영상 적용 가능 -->
    <div class="container">
        <p>REDEFINING VIRTUAL REALITY</p>
        <h1>ANTIGRAVITY</h1>
        <div class="menu">
            <a href="game.html" class="menu-item active">Start Round</a>
            <a href="history.html" class="menu-item">Dashboard</a>
            <a href="settings.html" class="menu-item">Equipment</a>
        </div>
    </div>
    <div class="footer-info">
        <div>18 HOLES CHAMPIONSHIP COURSE</div>
        <div>REAL-TIME POSE ANALYSIS V4.0</div>
        <div>AMMO.JS PHYSICS ENGINE</div>
    </div>
</body>

</html>
